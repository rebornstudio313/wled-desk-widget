name: Import prepared source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed source archive
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import zipfile
          root = Path.cwd().resolve()
          archive = root / 'wled-desk-widget-0.1.0-alpha.1-source.zip'
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = PurePosixPath(item.filename)
                  if not name.parts or name.parts[0] != 'wled-desk-widget' or '..' in name.parts:
                      raise ValueError('Unexpected archive path')
                  relative = Path(*name.parts[1:])
                  if not relative.parts or {'.git', '.local', 'node_modules', 'target', 'dist'} & set(relative.parts):
                      raise ValueError('Private or invalid path')
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
      - name: Commit source and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Import WLED Desk Widget source, documentation and media"
          git push
