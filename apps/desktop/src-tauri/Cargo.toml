[package]
name = "wled-desk-widget"
version = "0.1.0-alpha.3"
edition = "2021"
license = "MIT"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
auto-launch = "=0.6.0"
tauri-plugin-single-instance = "=2.5.5"
semver = "=1.0.28"
mdns-sd = "=0.21.1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }

futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = {version="=0.61.2",features= ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_HiDpi"] }
